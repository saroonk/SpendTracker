<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spend Tracker</title>
  <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">Spend Tracker</a>
      <div class="account-area">
        <span id="welcome-message"></span>
        <button id="logout-button" class="button button-dark hidden" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="login-section" class="panel">
      <h2>Login</h2>
      <form id="login-form">
        <label>Username <input id="username" required></label>
        <label>Password <input id="password" type="password" required></label>
        <button type="submit">Login</button>
      </form>
      <p id="login-message" class="message"></p>
      <button id="show-register-button" type="button">Create an account</button>
    </section>

    <section id="register-section" class="panel hidden">
      <h2>Create an account</h2>
      <form id="register-form">
        <label>First Name <input id="register-first-name"></label>
        <label>Last Name <input id="register-last-name"></label>
        <label>Username <input id="register-username" required></label>
        <label>Password <input id="register-password" type="password" required></label>
        <label>Confirm Password <input id="register-confirm-password" type="password" required></label>
        <button type="submit">Register</button>
      </form>
      <p id="register-message" class="message"></p>
      <button id="show-login-button" type="button">Already have an account? Login</button>
    </section>

    <section id="tracker-section" class="hidden">
      <div class="dashboard-grid">
        <form id="expense-form" class="panel">
          <h2>Add Expense</h2>
          <label>Amount (minimum ₹1.00) <input id="amount" type="number" min="1.00" step="0.01" required></label>
          <label>Category <select id="category" required></select></label>
          <label>Note <input id="note"></label>
          <label>Date <input id="date" type="date" required></label>
          <button type="submit">Add Expense</button>
          <p id="expense-message" class="message"></p>
        </form>
        <section class="panel">
          <h2>Filter Expenses</h2>
          <div class="filter-grid">
            <label>Category <select id="filter-category"><option value="">All Categories</option></select></label>
            <label>Start Date <input id="start-date" type="date"></label>
            <label>End Date <input id="end-date" type="date"></label>
          </div>
          <div class="button-row">
            <button id="filter-button" class="button button-dark" type="button">Apply Filter</button>
            <button id="clear-filters-button" class="button button-light" type="button">Clear Filter</button>
          </div>
          <p id="filter-message" class="message"></p>
        </section>
      </div>
      <section class="expenses-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Activity</p>
            <h2>My Expenses</h2>
          </div>
          <span id="expense-count" class="count-label"></span>
        </div>
        <div id="expense-list"></div>
      </section>
      <section class="summary-launch">
        <button id="view-summary-button" class="button button-dark" type="button">View Spending Summary</button>
      </section>
      <section id="summary-section" class="summary-modal hidden" aria-labelledby="summary-title">
        <div class="summary-dialog">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Overview</p>
              <h2 id="summary-title">Spending Summary</h2>
            </div>
            <button id="close-summary-button" class="button button-light" type="button">Close</button>
          </div>
          <div class="summary-grid">
            <div><span class="muted">Current Month</span><strong id="current-month-total">₹0.00</strong></div>
            <div><span class="muted">Previous Month</span><strong id="previous-month-total">₹0.00</strong></div>
            <div><span class="muted">Month-over-Month</span><strong id="month-over-month">0.00%</strong></div>
          </div>
          <h3>Spend by Category</h3>
          <div id="summary-by-category" class="summary-category-list"></div>
          <h3>Spending Insights</h3>
          <div id="summary-insights" class="summary-insights"></div>
        </div>
      </section>
    </section>
  </main>
  <script src="/frontend/app.js"></script>
</body>
</html>
